<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задания</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; --font-name: "Montserrat";
      --accent_color: #296eff; --green_color: #77ff29; --background_light_color: #ffffff1a;
      --gray_text_color: #ffffff80; --white_color: #fff;
      --background_default: radial-gradient(182% 85% at 50% 50%, #2d3036, #0c0d0e 100%);
      font-family: var(--font-name), system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0c0d0e; color: #fff; user-select: none; }
  .panel { position: fixed; inset: 0; overflow-y: auto; background: var(--background_default);
           padding: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px) + 8px) 16px calc(var(--tg-content-safe-area-inset-bottom, 0px) + 32px); }
  .balances { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
  .balance { display: flex; align-items: center; justify-content: center; gap: 4px; height: 42px;
             padding: 0 20px; border-radius: 24px; background: var(--background_light_color); }
  .balance img, .balance svg { width: 20px; height: 20px; }
  .balance p { font-size: 15px; font-weight: 600; }
  .wrap { width: 100%; max-width: 448px; margin: 0 auto; }
  .head { text-align: center; margin-bottom: 24px; }
  h2 { font-size: 24px; font-weight: 700; }
  .head p { color: var(--gray_text_color); font-size: 14px; font-weight: 500; margin-top: 6px; }
  .card { background: var(--background_light_color); border-radius: 24px; padding: 16px; margin-bottom: 16px; }
  .cell { display: flex; align-items: center; width: 100%; margin-bottom: 16px; cursor: pointer; }
  .cell:last-child { margin-bottom: 0; }
  .cell .before { flex-shrink: 0; width: 44px; height: 44px; margin-right: 14px; }
  .cell .before img, .cell .before svg { width: 44px; height: 44px; display: block; }
  .cell .before img.round { border-radius: 100px; }
  .cell .content { min-width: 0; }
  .cell h3 { font-size: 16px; font-weight: 600; }
  .reward { display: flex; align-items: center; margin-top: 3px; }
  .reward svg { width: 18px; height: 18px; margin-right: 6px; }
  .reward p { font-size: 14px; font-weight: 600; }
  .after { margin-left: auto; padding-left: 16px; flex-shrink: 0; display: flex; align-items: center; color: var(--gray_text_color); }
  .btn { border: 0; cursor: pointer; background: hsl(221 100% 58%); color: #fff; font-size: 13px; font-weight: 600;
         height: 40px; min-width: 50px; padding: 0 16px; border-radius: 14px; transition: transform .1s, opacity .15s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; }
  .icon { width: 24px; height: 24px; }
  .done { color: var(--green_color); display: flex; }
  .tabbar-bg { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
               backdrop-filter: blur(50px) saturate(160%); -webkit-backdrop-filter: blur(50px) saturate(160%);
               background: rgba(25, 27, 31, .6); padding-bottom: calc(var(--tg-content-safe-area-inset-bottom, 0px) + 32px); }
  .tabbar { width: 100%; max-width: 448px; margin: 0 auto; padding: 8px 0 0; display: flex; justify-content: space-around; }
  .tab { flex: 1 1 0; position: relative; text-align: center; cursor: pointer; color: rgb(141, 142, 143); }
  .tab .icon { width: 32px; height: 32px; display: block; margin: 0 auto; }
  .tab p { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .tab.active, .tab.active p { color: var(--accent_color); }
  .tab .badge { position: absolute; left: 50%; top: 0; transform: translateX(calc(-50% + 16px));
                min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: rgba(203, 33, 33, .9);
                color: #fff; font-size: 12px; font-weight: 600; line-height: 20px; }
  .badge[hidden] { display: none; }

  /* Окно задания (нижняя шторка) */
  .backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.8);
              backdrop-filter: blur(12px) saturate(1.5); -webkit-backdrop-filter: blur(12px) saturate(1.5);
              opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; width: calc(100% - 8px); max-width: 448px;
           margin: 0 auto 4px; border-radius: 24px 24px 20px 20px; padding: 0 16px 16px;
           background: radial-gradient(182% 85% at 50% 50%, #2d3036, #0c0d0e 100%);
           transform: translateY(110%); transition: transform .25s ease; }
  .modal-open .backdrop { opacity: 1; pointer-events: auto; }
  .modal-open #sheet { transform: none; }
  .sheet .close { position: absolute; top: 4px; right: 4px; padding: 12px; border: 0; border-radius: 50%;
                  background: none; color: rgba(255,255,255,.55); cursor: pointer; }
  .sheet .close svg { width: 24px; height: 24px; display: block; }
  .sheet .top { padding-top: 40px; text-align: center; }
  .sheet .top .pic { margin-bottom: 8px; }
  .sheet .top .pic img, .sheet .top .pic svg { width: 80px; height: 80px; margin: 0 auto; display: block; }
  .sheet .top .pic img.round { border-radius: 100px; }
  .sheet h2 { font-size: 24px; font-weight: 700; }
  .sheet .actions { margin-top: 24px; }
  .big { display: block; width: 100%; height: 56px; min-width: 96px; border: 0; border-radius: 20px;
         font-size: 18px; font-weight: 600; color: #fff; cursor: pointer; transition: transform .1s, opacity .15s; }
  .big:active { transform: scale(.97); }
  .big:disabled { opacity: .5; }
  .big.primary { background: hsl(221 100% 58%); }
  .big.secondary { background: hsl(270 67% 47%); }
  .actions .gap { height: 10px; }

  /* Плашки — один в один из индекса (notistack): красная «Выполните задание!» и тёмная «+N ★» */
  .css-1qqqvhh.notistack-MuiContent-error { background: rgb(171, 32, 32); color: rgb(255, 255, 255); border-radius: 24px; padding: 12px 24px; font-size: 16px; font-weight: 500; }
  .go1475592160 { height: 0px; }
  .go1671063245 { height: auto; }
  .go1888806478 { display: flex; flex-wrap: wrap; flex-grow: 1; }
  .go167266335 { background-color: rgb(49, 49, 49); font-size: 0.875rem; line-height: 1.43; letter-spacing: 0.01071em; color: rgb(255, 255, 255); align-items: center; padding: 6px 16px; border-radius: 4px; box-shadow: rgba(0, 0, 0, 0.2) 0px 3px 5px -1px, rgba(0, 0, 0, 0.14) 0px 6px 10px 0px, rgba(0, 0, 0, 0.12) 0px 1px 18px 0px; }
  .go3162094071 { padding-left: 20px; }
  .go3651055292 { background-color: rgb(211, 47, 47); }
  .go946087465 { display: flex; align-items: center; padding: 8px 0px; }
  .go3963613292 { width: 100%; position: relative; transform: translateX(0px); inset: 0px; min-width: 288px; }
  .go1141946668 { box-sizing: border-box; display: flex; max-height: 100%; position: fixed; z-index: 1400; height: auto; width: auto; transition: top 300ms, right 300ms, bottom 300ms, left 300ms, max-width 300ms; pointer-events: none; max-width: calc(100% - 40px); }
  .go1141946668 .notistack-CollapseWrapper { padding: 6px 0px; transition: padding 300ms; }
  .go3118922589 { top: 14px; flex-direction: column; }
  .go4034260886 { left: 50%; transform: translateX(-50%); }
  #frogToasts { top: 0; margin-top: calc(env(safe-area-inset-top, 0px) + var(--tg-content-safe-top, 0px) + 16px); width: min(448px, calc(100vw - 32px)); max-width: none; z-index: 100000; font-style: normal; display: flex; flex-direction: column; gap: 0; }
  #frogToasts .go3963613292 { min-width: 0; width: 100%; }

  /* Админ-панель */
  .admin-btn { position: fixed; top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px) + 8px); right: 16px;
               z-index: 5; width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--background_light_color);
               color: #fff; cursor: pointer; display: grid; place-items: center; }
  .admin-btn svg { width: 22px; height: 22px; }
  .admin-btn[hidden] { display: none; }
  .admin-open .backdrop { opacity: 1; pointer-events: auto; }
  .admin-open #adminSheet { transform: none; }
  #adminSheet { max-height: 92dvh; overflow-y: auto; padding-top: 16px; }
  #adminSheet h2 { text-align: center; margin: 12px 0 16px; }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 13px; font-weight: 600; color: var(--gray_text_color); margin-bottom: 6px; }
  .field input { width: 100%; height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12);
                 background: rgba(255,255,255,.08); color: #fff; font-size: 16px; outline: none; user-select: text; }
  .field input:focus { border-color: hsl(221 100% 58%); }
  .iconrow { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .iconrow img { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.08); object-fit: cover; }
  .iconrow button { height: 40px; padding: 0 16px; border: 0; border-radius: 14px; background: rgba(255,255,255,.12); color: #fff; font-weight: 600; cursor: pointer; }
  .alist { margin-top: 20px; }
  .alist h3 { font-size: 14px; color: var(--gray_text_color); margin-bottom: 8px; }
  .arow { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .arow img { width: 32px; height: 32px; border-radius: 50%; }
  .arow .t { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arow .r { font-size: 13px; color: var(--gray_text_color); }
  .arow button { border: 0; background: none; color: #ff5b5b; font-weight: 600; cursor: pointer; padding: 6px; }
  .empty { text-align: center; color: var(--gray_text_color); font-size: 14px; padding: 24px 0; }
</style>
</head>

async function load() {
  try {
    const d = await api('/api/tasks');
    tasks = d.tasks; isAdmin = d.isAdmin;
    if (d.stars != null) $('stars').textContent = fmt(d.stars);
  } catch (e) {
    if (DEMO) { tasks = [{ id: 'demo', title: 'Подпишитесь на наш канал', icon: DEFAULT_ICON, url: 'https://t.me/your_channel', reward: 1 }]; isAdmin = true; }
  }
  render();
}

function render() {
  $('adminBtn').hidden = !isAdmin;
  const root = $('cards'); root.innerHTML = '';
  if (!tasks.length) { root.innerHTML = '<div class="empty">Пока нет заданий</div>'; return; }
  const card = document.createElement('div'); card.className = 'card';
  tasks.forEach(t => {
    const cell = document.createElement('div'); cell.className = 'cell';
    cell.innerHTML = `<div class="before"><img class="round" src="${esc(safeSrc(t.icon))}" alt=""></div>
      <div class="content"><h3>${esc(t.title)}</h3>${t.done ? '' : `<div class="reward"><img src="${STAR}" alt="" width="18" height="18" style="margin-right:6px"><p>${fmt(t.reward)}</p></div>`}</div>
      <div class="after">${t.done ? `<div class="done">${CHECK}</div>` : '<button class="btn" type="button">Начать</button>'}</div>`;
    if (!t.done) cell.addEventListener('click', () => openSheet(t));
    card.appendChild(cell);
  });
  root.appendChild(card);
  renderAdminList();
}

/* ---- окно задания ---- */
function openSheet(t) {
  current = t;
  $('sheetPic').innerHTML = `<img class="round" src="${esc(safeSrc(t.icon))}" alt="">`;
  $('sheetTitle').textContent = t.title;
  $('sheet').setAttribute('aria-hidden', 'false');
  document.body.classList.add('modal-open');
}
function closeSheet() { document.body.classList.remove('modal-open'); $('sheet').setAttribute('aria-hidden', 'true'); current = null; }
$('sheetClose').onclick = closeSheet;
$('sheetStart').onclick = () => {
  if (!current) return;
  const u = current.url;
  visited.add(current.id);
  if (!DEMO) api('/api/tasks/' + encodeURIComponent(current.id) + '/start', { method: 'POST', body: '{}' }).catch(() => {});
  if (/^https:\/\/t\.me\//.test(u) && tg?.openTelegramLink) tg.openTelegramLink(u);
  else if (tg?.openLink) tg.openLink(u); else window.open(u, '_blank');
};
$('sheetCheck').onclick = async () => {
  if (!current) return;
  const btn = $('sheetCheck'), t = current;
  btn.disabled = true;
  try {
    if (!visited.has(t.id) || DEMO) { tg?.HapticFeedback?.notificationOccurred('error'); toast('bad', 'Выполните задание!'); }
    else {
      const d = await api('/api/tasks/' + encodeURIComponent(t.id) + '/check', { method: 'POST', body: '{}' });
      if (d.ok) {
        if (d.stars != null) $('stars').textContent = fmt(d.stars);
        t.done = true; visited.delete(t.id);
        closeSheet(); render();
        tg?.HapticFeedback?.notificationOccurred('success');
        if (d.already) toast('good', 'Задание уже выполнено');
        else toast('good', '+' + fmt(d.reward), true);
      } else {
        tg?.HapticFeedback?.notificationOccurred('error');
        toast('bad', d.notDone ? 'Выполните задание!' : (d.error || 'Выполните задание!'));
      }
    }
  } catch (e) { toast('bad', e.message); }
  btn.disabled = false;
};

$('aIconBtn').onclick = () => $('aIconFile').click();
$('aIconFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;

    const c = document.createElement('canvas'); c.width = c.height = 128;

    newIcon = c.toDataURL('image/png'); $('aIconPrev').src = newIcon; URL.revokeObjectURL(img.src);

};

  $('aAdd').disabled = true;
  try {
    if (DEMO) tasks.push({ id: 'd' + Date.now(), title, url, reward, icon: newIcon });
    else { await api('/api/admin/tasks', { method: 'POST', body: JSON.stringify({ title, url, reward, icon: newIcon }) }); await load(); }
    ['aTitleIn', 'aUrl', 'aReward'].forEach(i => $(i).value = '');
    newIcon = DEFAULT_ICON; $('aIconPrev').src = newIcon; render();
    tg?.HapticFeedback?.notificationOccurred('success');
  } catch (e) { say(e.message); }
  $('aAdd').disabled = false;
};
function renderAdminList() {
  $('aList').innerHTML = tasks.map(t => `<div class="arow"><img src="${esc(safeSrc(t.icon))}" alt=""><div class="t">${esc(t.title)}</div><div class="r">${fmt(t.reward)} ★</div><button type="button" data-id="${esc(t.id)}">Удалить</button></div>`).join('') || '<div class="empty">Заданий нет</div>';
}
$('aList').onclick = async e => {
  const id = e.target.dataset?.id; if (!id || !confirm('Удалить задание?')) return;
  try {
    if (DEMO) tasks = tasks.filter(t => t.id !== id);
    else { await api('/api/admin/tasks/' + encodeURIComponent(id), { method: 'DELETE' }); await load(); }
    render();
  } catch (err) { say(err.message); }
};

load();
</script>
</body>
</html>
