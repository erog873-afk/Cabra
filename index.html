<script>
  (function(){
    try{
      var tg = window.Telegram && window.Telegram.WebApp;
      if(!tg) return;

      tg.ready();

      // Полноэкранный режим (Bot API 8.0+), с фолбэком на обычный expand()
      if(typeof tg.requestFullscreen === 'function'){
        tg.requestFullscreen();
      } else if(typeof tg.expand === 'function'){
        tg.expand();
      }

      // Не даём случайно закрыть приложение свайпом вниз
      if(typeof tg.disableVerticalSwipes === 'function'){
        tg.disableVerticalSwipes();
      }

      // Учитываем высоту нативной панели Telegram (в фулскрине),
      // чтобы наша шестерёнка не налезала на "Закрыть"/меню
      function applySafeArea(){
        try{
          var top = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || 0;
          document.documentElement.style.setProperty('--tg-content-safe-top', top + 'px');
        }catch(e){}
      }
      applySafeArea();
      if(typeof tg.onEvent === 'function'){
        tg.onEvent('contentSafeAreaChanged', applySafeArea);
        tg.onEvent('fullscreenChanged', applySafeArea);
      }
    }catch(e){}
  })();
</script>

<style>
:root{
  --primary:#8774e1;
  --secondary:#f5f5f5;
  --main:#ffffff;
  --separator:rgba(0,0,0,.10);
  --subtitle:#9a9a9a;
  --button:#3b9dff;
  --tg-safe-area-inset-bottom:0px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#ffffff;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:relative;
}

/* Фоновый паттерн на весь экран */
body::before{
  content:"";

  position:fixed;

  inset:0;

  z-index:-1;

  pointer-events:none;

  background-color:var(--subtitle);

  mask-image:url(#giftBgMask);
  -webkit-mask-image:url(#giftBgMask);

  mask-repeat:no-repeat;
  -webkit-mask-repeat:no-repeat;

  mask-size:100% 100%;
  -webkit-mask-size:100% 100%;

  opacity:.35;
}

/* Основной контейнер */
.demo{
  min-height:100vh;
  padding:24px 16px 120px;
  max-width:600px;
  margin:auto;
}

.demo h2{
  font-size:20px;
  margin:10px 0;
}

.demo p{
  color:#777;
  font-size:14px;
}


/* =========================
   ШЕСТЕРЁНКА / НАСТРОЙКИ
   ========================= */

:root{
  --tg-content-safe-top:0px;
}
.top-nav{
  position:fixed;
  top:calc(env(safe-area-inset-top, 0px) + var(--tg-content-safe-top, 0px) + 52px);
  left:16px;
  z-index:50;
}

.gear-btn{
  width:44px;
  height:44px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--separator);
  background:rgba(255,255,255,.92);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:0 2px 16px rgba(0,0,0,.08);

  color:#111;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.gear-btn svg{
  width:22px;
  height:22px;
}

.settings-overlay{
  position:fixed;
  inset:0;
  z-index:100;

  background:rgba(0,0,0,.4);
  backdrop-filter:blur(4px);

  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}

.settings-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.settings-sheet-wrap{
  max-width:420px;
  margin:0 auto;

  position:absolute;
  left:8px;
  right:8px;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 25px);

  display:flex;
  flex-direction:column;
  gap:12px;

  transform:translateY(30px);
  transition:transform .25s ease;
}

.settings-overlay.open .settings-sheet-wrap{
  transform:translateY(0);
}

.settings-sheet{
  background:var(--secondary);
  border-radius:2rem;
  overflow:hidden;
}

.settings-sheet-header{
  position:relative;
  font-weight:500;
  font-size:16px;
  color:#111;
  padding:12px 20px;
  text-align:center;
  user-select:none;
}

.settings-sheet-handle{
  position:absolute;
  left:50%;
  top:6px;
  transform:translateX(-50%);
  width:40px;
  height:4px;
  border-radius:999px;
  background:rgba(0,0,0,.15);
}

.settings-sheet-body{
  padding:20px;
  background:var(--main);
  border-radius:2rem;
  border:1px solid var(--separator);
}

.settings-section-title{
  font-weight:600;
  display:block;
  color:#111;
}

.settings-section-title.spaced{
  margin:16px 0 8px;
}

.settings-pill-row{
  display:flex;
  gap:8px;
  font-weight:500;
  margin-top:8px;
}

.settings-pill{
  padding:8px 12px;
  border-radius:999px;
  border:none;
  font-family:inherit;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:all .3s;
  -webkit-tap-highlight-color:transparent;
  outline:none;
}

.settings-pill.active{
  background:var(--button);
  color:#fff;
}

.settings-pill.inactive{
  background:rgba(59,157,255,.12);
  box-shadow:0 0 0 1px rgba(59,157,255,.4) inset;
  color:var(--button);
}

.settings-support-btn{
  margin-top:8px;
  padding:8px 24px;
  border-radius:999px;
  border:none;
  background:var(--button);
  color:#fff;
  font-weight:500;
  font-size:14px;
  cursor:pointer;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}

.settings-close-wrap{
  padding:0 20px 4px;
}

.settings-close-btn{
  width:100%;
  padding:16px 24px;
  border-radius:999px;
  border:none;
  background:var(--button);
  color:#fff;
  font-weight:500;
  font-size:16px;
  cursor:pointer;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}


/* =========================
   НИЖНЯЯ НАВИГАЦИЯ
   ========================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  z-index:50;

  display:grid;
  grid-template-columns:1fr auto;

  align-items:center;

  gap:8px;

  padding:0 16px;

  padding-bottom:
    calc(
      var(--tg-safe-area-inset-bottom) + .7rem
    );
}


/* Светлый фон снизу */
.bottom-nav::before{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:110px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #ffffff
    );

  pointer-events:none;
}


/* Большая панель */
.nav-pill{
  position:relative;

  display:flex;
  align-items:center;

  border:1px solid var(--separator);

  border-radius:999px;

  background:rgba(255,255,255,.85);

  padding:8px 4px;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:
    0 2px 16px rgba(0,0,0,.08);
}


/* Активная подсветка */
.active-indicator{
  position:absolute;

  top:4px;
  bottom:4px;

  border-radius:999px;

  background:rgba(0,0,0,.05);

  border:1px solid rgba(0,0,0,.06);

  transition:
    all .3s ease-out;

  pointer-events:none;

  opacity:1;
}


/* Кнопки Игры / Задания / Лидеры */
.nav-item{
  position:relative;

  z-index:10;

  flex:1;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  padding:4px 6px;

  min-width:72px;

  color:var(--subtitle);

  text-decoration:none;

  -webkit-tap-highlight-color:transparent;
}

.nav-item.active{
  color:var(--button);
}




/* Иконки */
.nav-item svg{
  width:26px;
  height:26px;

  margin-bottom:4px;

  flex:none;
}


/* Названия */
.nav-item span{
  font-size:12px;

  line-height:1;

  font-weight:500;
}


/* =========================
   ПРОФИЛЬ
   ========================= */

.profile{
  position:relative;

  display:flex;

  align-items:center;
  justify-content:center;

  width:72px;
  height:72px;

  min-width:72px;
  min-height:72px;

  border-radius:50%;

  background:rgba(255,255,255,.92);

  border:2px solid rgba(0,0,0,.10);

  padding:5px;

  box-shadow:
    0 2px 16px rgba(0,0,0,.10),
    0 0 0 3px rgba(255,255,255,.75);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  overflow:hidden;

  align-self:center;

  text-decoration:none;

  -webkit-tap-highlight-color:transparent;
}




/* Аватар */
.profile img{
  display:block;

  width:100%;
  height:100%;

  border-radius:50%;

  object-fit:cover;
}


/* Если аватар недоступен */
.profile .fallback{
  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:var(--primary);

  color:#fff;

  font-size:20px;

  font-weight:600;
}


/* =========================
   МАЛЕНЬКИЕ ЭКРАНЫ
   ========================= */

@media(max-width:380px){

  .nav-item{
    min-width:58px;

    padding-left:2px;
    padding-right:2px;
  }

  .nav-item svg{
    width:24px;
    height:24px;
  }

  .profile{
    width:66px;
    height:66px;

    min-width:66px;
    min-height:66px;
  }
}

#casesPage .IconText--content{display:flex;align-items:center;margin:0 auto;width:max-content;}

/* Настройки: серый фон */
.settings-sheet{background:#2b2d32}
.settings-sheet-header{color:#fff}
.settings-sheet-handle{background:rgba(255,255,255,.25)}
.settings-sheet-body{background:#3a3c42;border-color:rgba(255,255,255,.10)}
.settings-section-title{color:#fff}
.settings-pill.inactive{background:rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;color:rgba(255,255,255,.75)}

/* ===== Профиль: кликабельный, синее свечение при выборе, цветная обводка у каждого своя ===== */
.profile{--ring:#3b9dff;cursor:pointer;border:3px solid var(--ring)!important;padding:2px;background:rgba(30,30,36,.92);transition:box-shadow .2s ease,transform .1s ease}
.profile:active{transform:scale(.96)}
.profile{border:2px solid rgba(255,255,255,.14)!important;padding:3px!important;box-shadow:0 2px 16px rgba(0,0,0,.4)!important}
.profile.is-active{border:4px solid rgba(30,30,36,.92)!important;transition:none!important;padding:2px!important;box-shadow:inset 0 0 0 2px #3b9dff,0 0 0 1px rgba(255,255,255,.10),0 2px 16px rgba(0,0,0,.4)!important}
body.profile-open .active-indicator{opacity:0}
body.profile-open,html.profile-open{overflow:hidden}
html.profile-open{background:#2b2d32!important}
body.profile-open::before{opacity:.2}
body.profile-open .bottom-nav::before{background:linear-gradient(to bottom,transparent,#2b2d32)}
body.profile-open .nav-pill{background:rgba(30,30,36,.85);border-color:rgba(255,255,255,.10);box-shadow:0 2px 16px rgba(0,0,0,.4)}
body.profile-open .gear-btn{background:rgba(30,30,36,.92);border-color:rgba(255,255,255,.10);color:#fff}
#profilePage{display:none;position:fixed;inset:0;z-index:1;overflow-y:auto;background:transparent;color:#fff;padding:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-top,0px) + 88px) 16px calc(140px + env(safe-area-inset-bottom,0px));font-family:Montserrat,Arial,Helvetica,sans-serif}
#profilePage.is-active{display:block}
#profilePage .pf-card{max-width:448px;margin:0 auto;text-align:center}
#profilePage .pf-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:24px;border:0;background:#3E4045;text-align:left;box-shadow:none}
#profilePage .pf-ava{width:64px;height:64px;flex:none;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#3b9dff}
#profilePage .pf-ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
#profilePage .pf-ava .fallback{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#3b9dff;color:#fff;font-size:26px;font-weight:700}
#profilePage .pf-info{min-width:0}
#profilePage .pf-name{font-weight:700;font-size:18px;line-height:1;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#profilePage .pf-user{font-weight:500;font-size:14px;margin-top:6px;color:rgba(255,255,255,.5)}
#profilePage h2.pf-title{margin:0 0 24px;font-size:24px;font-weight:700;color:#fff;text-align:center}
</style>
<style>
/* рулетка кейса: roulette.html загружается заранее и открывается мгновенно */
#rouletteFrame{position:fixed;inset:0;z-index:40;display:block;visibility:hidden;pointer-events:none;background:#fff}
#rouletteFrame.on{visibility:visible;pointer-events:auto}
#rouletteFrame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
body.roulette-open .bottom-nav{display:none!important}
body.roulette-open .top-nav,body.roulette-open .top-balance{opacity:1!important;pointer-events:auto!important}
/* на экране выигрыша баланс и настройки скрыты */
body.roulette-open.roulette-win .top-nav,body.roulette-open.roulette-win .top-balance,body.roulette-open.roulette-win #topBalance{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
</style>
<style>
/* ===== Вкладка «Задания» ===== */
body.tasks-open,html.tasks-open{overflow:hidden}
#tasksPage{display:none;position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:transparent;padding:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-top,0px) + 88px) 16px calc(120px + var(--tg-safe-area-inset-bottom,0px));font-family:Montserrat,Arial,Helvetica,sans-serif}
#tasksPage.is-active{display:block}
#tasksPage *{box-sizing:border-box}
#tasksPage .tasks-wrap{width:100%;max-width:448px;margin:0 auto}
#tasksPage h2{margin:0 0 16px;font-size:20px;font-weight:700;color:#111;text-align:center}
#tasksPage .task-list{display:flex;flex-direction:column;gap:12px}
#tasksPage .task{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:#e5e5e5;color:#111}
#tasksPage .task-ico{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:20px}
#tasksPage .task-body{flex:1;min-width:0}
#tasksPage .task-title{font-size:15px;font-weight:600;line-height:1.2;margin:0}
#tasksPage .task-reward{margin:4px 0 0;font-size:13px;font-weight:600;color:rgb(255,194,53)}
#tasksPage .task-btn{flex:none;border:0;border-radius:9999px;padding:9px 16px;font:600 13px Montserrat,Arial,sans-serif;color:#fff;background:var(--button);cursor:pointer;-webkit-tap-highlight-color:transparent}
#tasksPage .task-btn:active{opacity:.8}
#tasksPage .task.done .task-btn{background:rgba(255,255,255,.18);color:rgba(255,255,255,.7);pointer-events:none}

<script>

/* ==========================================
   Переключение активной кнопки
   ========================================== */

const items = [
  ...document.querySelectorAll('.nav-item')
];

const indicator =
  document.querySelector('.active-indicator');


function moveIndicator(item){

  if(!item) return;

  indicator.style.width =
    item.offsetWidth + 'px';

  indicator.style.left =
    item.offsetLeft + 'px';
}


items.forEach(item => {

  item.addEventListener('click', (e) => {

    e.preventDefault();

    items.forEach(x =>
      x.classList.remove('active')
    );

    items.forEach(x =>
      x.removeAttribute('aria-current')
    );

    item.classList.add('active');

    item.setAttribute(
      'aria-current',
      'page'
    );

    requestAnimationFrame(() => {
      moveIndicator(item);
    });

  });

});


window.addEventListener(
  'resize',
  () => {

    moveIndicator(
      document.querySelector(
        '.nav-item.active'
      )
    );

  }
);


requestAnimationFrame(() => {

  moveIndicator(
    document.querySelector(
      '.nav-item.active'
    )
  );

});


/* ==========================================
   TELEGRAM АВАТАР
   ========================================== */

(function(){

  const profileBtn =
    document.getElementById(
      'profileBtn'
    );

  let user = null;


  try{

    if(
      window.Telegram &&
      window.Telegram.WebApp
    ){

      window.Telegram.WebApp.ready();

      user =
        window.Telegram.WebApp
          .initDataUnsafe &&
        window.Telegram.WebApp
          .initDataUnsafe.user;

    }

  }catch(e){}


  function showFallback(name){

    const letter =
      (name || '?')
        .trim()
        .charAt(0)
        .toUpperCase();


    const div =
      document.createElement(
        'div'
      );

    div.className =
      'fallback';

    div.textContent =
      letter;


    profileBtn.innerHTML = '';

    profileBtn.appendChild(
      div
    );

  }


  if(
    !window.APEX_FORCE_AVA &&
    user &&
    user.photo_url
  ){

    const img =
      document.createElement(
        'img'
      );

    img.alt =
      'Профиль';

    img.src =
      user.photo_url;


    img.onerror =
      () => {

        showFallback(
          user.first_name
        );

      };


    profileBtn.appendChild(
      img
    );

  }else{

    showFallback(
      (user && user.first_name) || '?'
    );

  }

})();


/* ==========================================
   ШЕСТЕРЁНКА / НАСТРОЙКИ
   ========================== */

(function(){

  const overlay = document.getElementById('settingsOverlay');
  const gearBtn = document.getElementById('gearBtn');
  const closeBtn = document.getElementById('settingsCloseBtn');
  const supportBtn = document.getElementById('i18nSupportBtn');

  const SUPPORT_USERNAME = 'ViperCaseHelp';

  function openSupport(){
    try{
      if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink){
        window.Telegram.WebApp.openTelegramLink('https://t.me/' + SUPPORT_USERNAME);
        return;
      }
    }catch(e){}
    window.open('https://t.me/' + SUPPORT_USERNAME, '_blank');
  }

  if(supportBtn){
    supportBtn.addEventListener('click', openSupport);
  }

  function openSettings(){
    overlay.classList.add('open');
  }

  function closeSettings(){
    overlay.classList.remove('open');
  }

  gearBtn.addEventListener('click', openSettings);
  closeBtn.addEventListener('click', closeSettings);

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closeSettings();
  });

  /* ---------- Переводы ---------- */

  const translations = {
    ru:{
      settingsTitle:'Настройки',
      languageTitle:'Язык',
      vibrationTitle:'Вибрация',
      vibrationOn:'Вкл.',
      vibrationOff:'Выкл.',
      helpTitle:'Помощь',
      supportBtn:'Написать в поддержку',
      closeBtn:'Закрыть',
      navGames:'Игры',
      navTasks:'Задания',
      navLeaders:'Лидеры'
    },
    en:{
      settingsTitle:'Settings',
      languageTitle:'Language',
      vibrationTitle:'Vibration',
      vibrationOn:'On',
      vibrationOff:'Off',
      helpTitle:'Help',
      supportBtn:'Contact support',
      closeBtn:'Close',
      navGames:'Games',
      navTasks:'Tasks',
      navLeaders:'Leaders'
    }
  };

  const ids = {
    settingsTitle:'i18nSettingsTitle',
    languageTitle:'i18nLanguageTitle',
    vibrationTitle:'i18nVibrationTitle',
    vibrationOn:'i18nVibrationOn',
    vibrationOff:'i18nVibrationOff',
    helpTitle:'i18nHelpTitle',
    supportBtn:'i18nSupportBtn',
    closeBtn:'settingsCloseBtn',
    navGames:'i18nNavGames',
    navTasks:'i18nNavTasks',
    navLeaders:'i18nNavLeaders'
  };

  let currentLang = localStorage.getItem('apex_lang') || 'ru';
  let vibrationEnabled = localStorage.getItem('apex_vibration') !== 'off';

  function applyLanguage(lang){
    currentLang = lang;
    localStorage.setItem('apex_lang', lang);
    const t = translations[lang] || translations.ru;

    Object.keys(ids).forEach(key => {
      const el = document.getElementById(ids[key]);
      if(el) el.textContent = t[key];
    });

    document.querySelectorAll('[data-lang]').forEach(btn => {
      const isActive = btn.getAttribute('data-lang') === lang;
      btn.classList.toggle('active', isActive);
      btn.classList.toggle('inactive', !isActive);
      btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
  }

  function applyVibrationUI(enabled){
    vibrationEnabled = enabled;
    localStorage.setItem('apex_vibration', enabled ? 'on' : 'off');

    document.querySelectorAll('[data-vibration]').forEach(btn => {
      const isActive = (btn.getAttribute('data-vibration') === 'on') === enabled;
      btn.classList.toggle('active', isActive);
      btn.classList.toggle('inactive', !isActive);
      btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
  }

  function triggerHaptic(){
    if(!vibrationEnabled) return;
    try{
      if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback){
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
    }catch(e){}
  }

  window.apexHaptic = triggerHaptic;
  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => {
      applyLanguage(btn.getAttribute('data-lang'));
      triggerHaptic();
    });
  });

  document.querySelectorAll('[data-vibration]').forEach(btn => {
    btn.addEventListener('click', () => {
      const enable = btn.getAttribute('data-vibration') === 'on';
      triggerHaptic();
      applyVibrationUI(enable);
    });
  });

  applyLanguage(currentLang);
  applyVibrationUI(vibrationEnabled);

  document.addEventListener('click', (e) => {
    const btn = e.target.closest(
      '.nav-item, .gear-btn, .profile, .settings-support-btn, .settings-close-btn'
    );
    if(btn) triggerHaptic();
  });

})();

</script>

<script>
/* Показ страницы «Кейсы» */
(function(){
  const page = document.getElementById('casesPage');
  function sync(){
    const a = document.querySelector('.nav-item.active');
    const on = !!a && a.getAttribute('data-page') === 'cases';
    page.classList.toggle('is-active', on);
    document.body.classList.toggle('cases-open', on);
    document.documentElement.classList.toggle('cases-open', on);
  }
  document.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => setTimeout(sync, 0)));
  /* Шестерёнка стоит на месте; видна только когда кейсы промотаны в самый верх */
  const gear = document.querySelector('.top-nav');
  function gearVis(){
    const away = page.classList.contains('is-active') && page.scrollTop > 8;
    gear.classList.toggle('is-away', away);
    const bal = document.getElementById('topBalance');
    if(bal) bal.classList.toggle('is-away', away);
  }
  page.addEventListener('scroll', gearVis, {passive:true});
  document.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => setTimeout(gearVis, 0)));
  gearVis();
  sync();
})();
</script>

body.tk-modal-open .tk-backdrop,body.tk-admin-open .tk-backdrop{opacity:1;pointer-events:auto}
body.tk-modal-open #tkSheet,body.tk-admin-open #tkAdminSheet{transform:none}
.tk-close{position:absolute;top:4px;right:4px;padding:12px;border:0;border-radius:50%;background:none;color:rgba(255,255,255,.55);cursor:pointer}
.tk-close svg{width:24px;height:24px;display:block}
.tk-top{padding-top:40px;text-align:center}
.tk-pic{margin-bottom:8px}
.tk-pic img{width:80px;height:80px;margin:0 auto;display:block;border-radius:100px}
.tk-sheet h2{margin:0;font-size:24px;font-weight:700;color:#fff}
.tk-actions{margin-top:24px}
.tk-gap{height:10px}
.tk-big{display:block;width:100%;height:56px;border:0;border-radius:20px;font-size:18px;font-weight:600;color:#fff;cursor:pointer;transition:transform .1s,opacity .15s}
.tk-big:active{transform:scale(.97)}
.tk-big:disabled{opacity:.5}
.tk-primary{background:hsl(221 100% 58%)}
.tk-secondary{background:hsl(270 67% 47%)}
#tkAdminSheet{max-height:92dvh;overflow-y:auto;padding-top:16px}
.tk-atitle{text-align:center;margin:12px 0 16px!important}
.tk-field{display:block;margin-bottom:12px}
.tk-field span{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:6px}
.tk-field input{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.tk-field input:focus{border-color:hsl(221 100% 58%)}
.tk-iconrow{display:flex;align-items:center;gap:14px;margin-bottom:12px}

.tk-iconrow button{height:40px;padding:0 16px;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;cursor:pointer}
.tk-alist{margin-top:20px}
.tk-alist h3{margin:0 0 8px;font-size:14px;color:rgba(255,255,255,.5)}
.tk-arow{display:flex;align-items:center;gap:10px;padding:8px 0}
.tk-arow img{width:32px;height:32px;border-radius:50%}
.tk-arow .t{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-arow .r{font-size:13px;color:rgba(255,255,255,.5)}
.tk-arow button{border:0;background:none;color:#ff5b5b;font-weight:600;cursor:pointer;padding:6px}

<script>
/* Перевод остальных надписей (названия кейсов, заголовки, подписи) под переключатель языка.
   Чтобы добавить новый кейс или текст — допишите пару «русский: английский» в словарь. */
(function(){
  var DICT={
    'Профиль':'Profile',
    'Рулетка':'Roulette',
    'Пополнить баланс':'Top up balance',
    'Пополнение баланса':'Top up balance',
    'Настройки':'Settings','Язык':'Language','Вибрация':'Vibration','Вкл.':'On','Выкл.':'Off','Помощь':'Help',
    'Написать в поддержку':'Contact support','Закрыть':'Close','Игры':'Games','Задания':'Tasks','Лидеры':'Leaders','Пополнить':'Top up'
  };
  var REV={};Object.keys(DICT).forEach(function(k){REV[DICT[k]]=k});
  function lang(){try{return localStorage.getItem('apex_lang')==='en'?'en':'ru'}catch(e){return 'ru'}}
  function tr(s,l){var t=s.trim();if(!t)return s;var to=(l==='en')?DICT[t]:REV[t];return to?s.replace(t,to):s}
  function run(){
    var l=lang(), w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null), n, list=[];
    while((n=w.nextNode())){
      var p=n.parentNode; if(!p||p.nodeName==='SCRIPT'||p.nodeName==='STYLE') continue;
      if(p.closest&&(p.closest('#rouletteFrame')||p.closest('#casesPage')||p.closest('#gamesPage'))) continue;
      list.push(n);
    }
    list.forEach(function(n){var v=tr(n.nodeValue,l); if(v!==n.nodeValue) n.nodeValue=v;});
    document.querySelectorAll('[aria-label],[title]').forEach(function(e){
      ['aria-label','title'].forEach(function(a){var v=e.getAttribute(a); if(v){var t=tr(v,l); if(t!==v) e.setAttribute(a,t);}});
    });
  }
  run();
  document.addEventListener('click',function(e){ if(e.target.closest('[data-lang]')) setTimeout(run,0); });
  window.addEventListener('load',function(){ setTimeout(run,300); });
  window.__apexTranslate=run;
})();
</script>

    body.innerHTML = html;
  }
  function showError(){
    head();
    body.innerHTML = '<div class="lb-card"><div class="lb-msg">' + t('err') + '<br><button class="lb-btn" id="lbRetry">' + t('retry') + '</button></div></div>';
    var b = body.querySelector('#lbRetry'); if(b) b.onclick = function(){ fails = 0; load(true); };
  }

  /* Как в «Заданиях»: крутилка при первой загрузке (минимум 1 с, чтобы не мигала),
     при ошибке сам повторяет запрос через 2 с, после 3 неудач показывает кнопку «Повторить».
     Когда данные уже есть, обновление идёт тихо, без крутилки. */
  var lastLoad = 0, loading = false, loaded = false, fails = 0, retryTimer = 0, lastJson = '', lastData = null;
  function load(force){
    if(loading) return;
    if(!force && Date.now() - lastLoad < 15000) return;
    loading = true;
    var t0 = Date.now(), first = !loaded;
    if(first) body.innerHTML = LOADER;
    fetch(API + '/api/leaders', { headers: { 'X-Init-Data': (tg && tg.initData) || '' } })
      .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(d){
        return new Promise(function(res){
          setTimeout(function(){ res(d); }, first ? Math.max(0, 1000 - (Date.now() - t0)) : 0);
        });
      })
      .then(function(d){
        loaded = true; fails = 0; lastLoad = Date.now();
        if(d && d.endsAt){ endsAt = Number(d.endsAt); saveEnd(endsAt); }
        lastData = d;
        var j = JSON.stringify([d && d.top, d && d.me]);
        if(j !== lastJson){ lastJson = j; render(d); }
      })
      .catch(function(){
        if(loaded) return; /* данные уже на экране: оставляем их */
        fails++;
        if(fails < 3){ clearTimeout(retryTimer); retryTimer = setTimeout(function(){ load(true); }, 2000); }
        else showError();
      })
      .then(function(){ loading = false; });
  }

  /* ---- показ только на вкладке «Лидеры» ---- */
  var wasOn = false;
  function sync(){
    watchBalance();
    var a = document.querySelector('.nav-item.active');
    var on = !!a && a.getAttribute('data-page') === 'leaderboard';
    page.classList.toggle('is-active', on);
    if(on && !wasOn){ head(); load(false); }
    if(!on && wasOn){ page.scrollTop = 0; }
    wasOn = on;
  }
  document.addEventListener('click', function(e){
    if(e.target.closest && e.target.closest('.nav-item')) setTimeout(sync, 60);
  }, true);
  setInterval(sync, 400);
  setInterval(function(){ if(page.classList.contains('is-active')) tick(); }, 1000);
  /* ---- живое обновление: страницу перезагружать не нужно ---- */
  var dirty = false, balTimer = 0, balObs = null;
  function active(){ return page.classList.contains('is-active'); }
  /* баланс из верхней плашки (число), либо null, если формат не распознан */
  function balNow(){
    var el = document.querySelector('.top-balance');
    var txt = el ? (el.textContent || '').trim() : '';
    if(!txt || /[A-Za-zА-Яа-я]/.test(txt)) return null;
    var m = txt.match(/\d[\d\s\u00a0]*(?:[.,]\d+)?/);
    if(!m) return null;
    var n = parseFloat(m[0].replace(/[\s\u00a0]/g, '').replace(',', '.'));
    return isFinite(n) ? n : null;
  }
  /* сразу пересчитываем «Вы» и место в списке по новому балансу */
  function applyLocal(n){
    if(!lastData || !active()) return;
    var d = JSON.parse(JSON.stringify(lastData)), me = d.me || { rank: null, stars: 0, photo: '', name: '' };
    if(Number(me.stars) === n) return;
    var top = (d.top || []).filter(function(x){ return !x.me; });
    if(n > 0) top.push({ rank: 0, name: me.name || '', photo: me.photo || '', stars: n, me: true });
    top.sort(function(a, b){ return b.stars - a.stars; });
    top = top.slice(0, MAX_RANK);
    top.forEach(function(x, i){ x.rank = i + 1; });
    var mine = top.filter(function(x){ return x.me; })[0];
    me.stars = n; me.rank = mine ? mine.rank : null;
    d.top = top; d.me = me;
    lastData = d; lastJson = JSON.stringify([d.top, d.me]);
    render(d);
  }
  /* как только меняется баланс сверху (заработал звёзды), список сразу перезапрашивается */
  function watchBalance(){
    var el = document.querySelector('.top-balance');
    if(!el || balObs) return;
    balObs = new MutationObserver(function(){
      if(!active()){ dirty = true; return; }
      var n = balNow();
      if(n !== null) applyLocal(n); /* мгновенно, не дожидаясь сервера */
      clearTimeout(balTimer);
      balTimer = setTimeout(function(){ load(true); }, 150); /* и тут же сверяемся с сервером */
    });
    balObs.observe(el, { childList: true, subtree: true, characterData: true });
  }
  setInterval(function(){ watchBalance(); if(active() && !document.hidden) load(true); }, 3000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && active()) load(true); });
  setInterval(function(){ if(dirty && active()){ dirty = false; var n = balNow(); if(n !== null) applyLocal(n); load(true); } }, 200);
  watchBalance();
  head(); sync();
})();

</script>
<script src="balance-widget.js?v=3"></script>
</body>
</html>
