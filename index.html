<!doctype html>
<html lang='ru'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width'>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
.page{width:390px;height:844px;margin:auto;background:#181818;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center}
.name{font-weight:600}
.gear{border:0;background:#242424;color:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center}
.gear svg{width:16px;height:16px}

.modal{
  margin-top:145px;
  background:#212121;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 25px 70px #000b;
  padding-bottom:20px;
}

.head{
  position:relative;
  text-align:center;
  font-size:16px;
  font-weight:500;
  padding:17px 20px 15px;
}

.handle{
  position:absolute;
  top:6px;
  left:50%;
  transform:translateX(-50%);
  height:4px;
  width:40px;
  border-radius:8px;
  background:rgba(255,255,255,.28)
}

.body{
  padding:20px;
  background:#242424;
  border-radius:30px;
}

.label{
  font-weight:600;
  font-size:15px;
  margin-bottom:9px
}

.group{
  display:flex;
  gap:8px;
  margin-bottom:17px
}

.btn{
  border:0;
  padding:9px 15px;
  border-radius:999px;
  background:#303030;
  color:#bbb;
  font-size:14px
}

.btn.active{
  background:#3390ec;
  color:#fff
}

.help{
  margin-top:4px
}

.support{
  border:0;
  background:#3390ec;
  color:#fff;
  border-radius:999px;
  padding:9px 24px;
  font-size:14px
}

.footer{
  margin-top:4px;
  padding:0 20px;
}

.close{
  width:100%;
  border:0;
  background:#3390ec;
  color:#fff;
  border-radius:999px;
  padding:14px;
  font-size:15px
}
</style>
</head>
