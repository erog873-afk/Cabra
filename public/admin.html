<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кейсы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0f1015;color:#fff;font-family:Arial,sans-serif}body{padding:calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}.wrap{max-width:620px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.title{font-size:24px;font-weight:800}.sub{color:#8d9098;font-size:13px;margin-top:4px}.btn{border:0;border-radius:12px;padding:11px 14px;background:#252833;color:#fff;font-weight:700}.btn.primary{background:#fff;color:#111}.btn.danger{background:#4b2025;color:#ffb4bb}.btn.small{padding:8px 10px;font-size:12px}.list{display:grid;gap:10px}.case{background:#191b23;border:1px solid #282b35;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px}.caseimg{width:64px;height:64px;border-radius:14px;background:#252833;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.caseimg img{width:100%;height:100%;object-fit:contain}.caseinfo{min-width:0;flex:1}.name{font-weight:800;font-size:16px}.meta{color:#9a9da6;font-size:13px;margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.panel{background:#191b23;border:1px solid #282b35;border-radius:18px;padding:14px;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;color:#a4a7b0;font-size:12px;margin:0 0 6px}.field input,.field select{width:100%;background:#101218;border:1px solid #30333d;color:#fff;border-radius:11px;padding:12px;outline:none}.gift{background:#111319;border:1px solid #292c35;border-radius:14px;padding:10px;margin-top:8px}.giftgrid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:8px}.giftgrid input{width:100%;background:#191b23;border:1px solid #30333d;color:#fff;border-radius:9px;padding:9px}.giftrow{display:flex;gap:8px;align-items:center}.gifticon{width:44px;height:44px;border-radius:10px;background:#252833;overflow:hidden;flex:none}.gifticon img{width:100%;height:100%;object-fit:contain}.empty{padding:24px;text-align:center;color:#858892;background:#191b23;border-radius:16px}.topbar{display:flex;gap:8px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}.hint{font-size:12px;color:#777b86;line-height:1.4;margin-top:8px}.divider{height:1px;background:#292c35;margin:14px 0}@media(max-width:430px){.row,.giftgrid{grid-template-columns:1fr}.case{align-items:flex-start}.actions{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><div class="title">Кейсы</div><div class="sub">Управление кейсами и подарками</div></div><div class="topbar"><button class="btn small" id="refresh">Обновить</button><button class="btn primary small" id="addCase">Добавить</button></div></div>
  <div id="list" class="list"></div>
  <div id="editor" class="panel hidden"></div>
</div>
<div id="toast" class="toast"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const API='';
let data={version:0,cases:[]},editing=null;
const gradients={gray:'Серый',purple:'Фиолетовый',pink:'Розовый',red:'Красный'};
function authHeaders(){const h={'Content-Type':'application/json'};if(tg&&tg.initData)h['X-Telegram-Init-Data']=tg.initData;return h}
async function api(path,opt={}){const r=await fetch(API+path,{cache:'no-store',...opt,headers:{...authHeaders(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return new Intl.NumberFormat('ru-RU').format(Number(n)||0)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1400)}
function renderList(){const el=document.getElementById('list');if(!data.cases.length){el.innerHTML='<div class="empty">Кейсов пока нет</div>';return}el.innerHTML=data.cases.map(c=>`<div class="case"><div class="caseimg">${c.icon?`<img src="${esc(c.icon)}">`:''}</div><div class="caseinfo"><div class="name">${esc(c.name||'Без названия')}</div><div class="meta">${money(c.price)} ⭐ · ${c.gifts.length} подарков · ${esc(c.section)}</div></div><div class="actions"><button class="btn small" data-edit="${esc(c.id)}">Изменить</button><button class="btn danger small" data-del="${esc(c.id)}">Удалить</button></div></div>`).join('')}
function giftHtml(g,i){return `<div class="gift" data-gift="${esc(g.id)}"><div class="giftrow"><div class="gifticon">${g.icon?`<img src="${esc(g.icon)}">`:''}</div><div style="flex:1"><div class="giftgrid"><input data-f="name" value="${esc(g.name)}" placeholder="Название"><input data-f="price" type="number" step="0.01" value="${g.price}" placeholder="Цена"><input data-f="chance" type="number" step="0.01" min="0" value="${g.chance}" placeholder="Шанс %"></div><div style="margin-top:8px"><input data-f="icon" style="width:100%;background:#191b23;border:1px solid #30333d;color:#fff;border-radius:9px;padding:9px" value="${esc(g.icon)}" placeholder="Ссылка на иконку подарка"></div></div><button class="btn danger small" data-remove-gift="${esc(g.id)}">Удалить</button></div></div>`}
function openEditor(id){editing=id||('case_'+Date.now());let c=data.cases.find(x=>x.id===id);if(!c){c={id:editing,section:'Рулетка с NFT',name:'',icon:'',price:0,gradient:'purple',enabled:true,gifts:[]};data.cases.push(c)}const e=document.getElementById('editor');e.classList.remove('hidden');e.innerHTML=`<div class="head" style="margin-bottom:10px"><div><div class="title" style="font-size:19px">${id?'Редактирование':'Новый кейс'}</div></div><button class="btn small" id="closeEdit">Закрыть</button></div><div class="row"><div class="field"><label>Название кейса</label><input id="cName" value="${esc(c.name)}" placeholder="Например: Мороженое"></div><div class="field"><label>Цена кейса</label><input id="cPrice" type="number" step="0.01" value="${c.price}"></div></div><div class="row"><div class="field"><label>Иконка кейса</label><input id="cIcon" value="${esc(c.icon)}" placeholder="Ссылка на иконку"></div><div class="field"><label>Раздел</label><select id="cSection"><option>Рулетка со звездами</option><option>Рулетка с NFT</option><option>Гарантированный NFT</option></select></div></div><div class="row"><div class="field"><label>Фон карточки</label><select id="cGradient">${Object.entries(gradients).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Статус</label><select id="cEnabled"><option value="true">Включён</option><option value="false">Выключен</option></select></div></div><div class="divider"></div><div style="display:flex;justify-content:space-between;align-items:center"><b>Подарки</b><button class="btn small" id="addGift">Добавить подарок</button></div><div id="gifts">${c.gifts.map(giftHtml).join('')||'<div class="empty" style="margin-top:8px">Подарков пока нет</div>'}</div><div class="hint">Шансы задаются в процентах. Сумма шансов должна быть 100% — сервер не будет автоматически менять твои значения.</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" id="saveCase" style="flex:1">Сохранить</button><button class="btn" id="cancelCase">Отмена</button></div>`;document.getElementById('cSection').value=c.section;document.getElementById('cGradient').value=c.gradient;document.getElementById('cEnabled').value=String(c.enabled);bindEditor(c)}
function bindEditor(c){document.getElementById('closeEdit').onclick=closeEditor;document.getElementById('cancelCase').onclick=closeEditor;document.getElementById('addGift').onclick=()=>{c.gifts.push({id:'gift_'+Date.now(),name:'',icon:'',price:0,chance:0});openEditor(c.id)};document.getElementById('saveCase').onclick=saveCase;document.getElementById('gifts').addEventListener('click',e=>{const b=e.target.closest('[data-remove-gift]');if(!b)return;c.gifts=c.gifts.filter(g=>g.id!==b.dataset.removeGift);openEditor(c.id)})}
function collectEditor(c){c.name=document.getElementById('cName').value.trim();c.price=Number(document.getElementById('cPrice').value)||0;c.icon=document.getElementById('cIcon').value.trim();c.section=document.getElementById('cSection').value;c.gradient=document.getElementById('cGradient').value;c.enabled=document.getElementById('cEnabled').value==='true';document.querySelectorAll('.gift').forEach(row=>{const g=c.gifts.find(x=>x.id===row.dataset.gift);if(!g)return;g.name=row.querySelector('[data-f="name"]').value.trim();g.price=Number(row.querySelector('[data-f="price"]').value)||0;g.chance=Number(row.querySelector('[data-f="chance"]').value)||0;g.icon=row.querySelector('[data-f="icon"]').value.trim()})}
async function saveCase(){const c=data.cases.find(x=>x.id===editing);collectEditor(c);if(!c.name)return toast('Напиши название кейса');try{const j=await api('/api/admin/cases',{method:'PUT',body:JSON.stringify({cases:data.cases})});data=j.data;toast('Сохранено');renderList();closeEditor()}catch(e){toast(e.message)}}
function closeEditor(){editing=null;document.getElementById('editor').classList.add('hidden')}
async function load(){try{const j=await api('/api/cases');data=j;renderList();if(editing){const c=data.cases.find(x=>x.id===editing);if(c)openEditor(editing)}}catch(e){document.getElementById('list').innerHTML='<div class="empty">Ошибка загрузки: '+esc(e.message)+'</div>'}}
document.getElementById('addCase').onclick=()=>openEditor();document.getElementById('refresh').onclick=load;document.getElementById('list').addEventListener('click',e=>{const ed=e.target.closest('[data-edit]');if(ed)openEditor(ed.dataset.edit);const del=e.target.closest('[data-del]');if(del)deleteCase(del.dataset.del)});
async function deleteCase(id){if(!confirm('Удалить этот кейс?'))return;data.cases=data.cases.filter(c=>c.id!==id);try{const j=await api('/api/admin/cases',{method:'PUT',body:JSON.stringify({cases:data.cases})});data=j.data;renderList();toast('Кейс удалён')}catch(e){toast(e.message)}}
load();setInterval(function(){ if(!editing) load(); },2000);
</script>
</body></html>
