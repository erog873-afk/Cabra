<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Админ-панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* ===== НАСТРОЙКИ АДМИНКИ ===== */
window.APEX_ADMIN_IDS = [];            /* Telegram ID админов, например [123456789]. Пусто = без проверки (только для теста). Настоящую проверку делает сервер. */
/* window.APEX_API = "https://ваш-домен";   <- раскомментируйте, чтобы правки видели ВСЕ пользователи (см. server.py) */
</script>
<script src="cases-store.js"></script>
<style>
:root{--bg:#0f0f17;--card:#1a1a26;--card2:#232333;--line:rgba(255,255,255,.09);--tx:#fff;--mut:#9a9bb0;--pur:#6842d8;--pur2:#3b17a4;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--star:#ffc235}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,-apple-system,Arial,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 90px)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pur)}
select{appearance:none}
label{display:block;font-size:12px;color:var(--mut);margin:12px 2px 6px;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.top h1{font-size:22px;margin:0;font-weight:800}
.status{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.status.busy i{background:var(--warn)}.status.err i{background:var(--bad)}
.mode{font-size:11px;color:var(--mut);margin:0 0 14px}
.toolbar{display:flex;gap:8px;margin:0 0 6px;flex-wrap:wrap}
.chipbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-size:15px;margin:0;font-weight:700}
.sec-h span{color:var(--mut);font-weight:600;font-size:12px;margin-left:6px}
.add{background:linear-gradient(135deg,var(--pur),var(--pur2));border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
.mini{flex:none;width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mini img{width:42px;height:42px;object-fit:contain}
.mini.dark{background:radial-gradient(50% 100%,rgb(71,67,84),rgb(37,37,52))}.mini.purple{background:radial-gradient(50% 100%,rgb(104,66,216),rgb(59,23,164))}
.row .nm{font-weight:700;font-size:15px}.row .sub{font-size:12px;color:var(--mut);margin-top:3px}
.row .pr{margin-left:auto;text-align:right;font-weight:800;color:var(--star);white-space:nowrap}
.tag{display:inline-block;font-size:11px;border-radius:8px;padding:2px 7px;margin-left:6px;font-weight:700}
.tag.ok{background:rgba(52,211,153,.15);color:var(--ok)}.tag.warn{background:rgba(251,191,36,.15);color:var(--warn)}.tag.none{background:rgba(255,255,255,.08);color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
/* окна */
.layer{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 110px)}
.layer.on{display:block}
.layer.sheet{z-index:70;background:rgba(0,0,0,.55);padding:0;overflow:hidden}
.layer.sheet.on{display:flex;align-items:flex-end}
.sheet-box{background:var(--card);width:100%;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:20px}
.hd h2{margin:0;font-size:18px;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.tile{border-radius:18px;min-height:104px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tile.dark{background:radial-gradient(50% 100%,rgb(71,67,84),rgb(37,37,52))}.tile.red{background:radial-gradient(50% 100%,rgb(224,64,74),rgb(150,22,38))}.tile.purple{background:radial-gradient(50% 100%,rgb(104,66,216),rgb(59,23,164))}
.tile img{width:38px;height:38px;object-fit:contain}
.tile b{font-size:18px}.tile small{font-size:11px;color:rgba(255,255,255,.75);font-weight:600}
.tile.plus{background:var(--card);border:2px dashed rgba(255,255,255,.2);font-size:34px;color:var(--mut)}
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 2px 4px;font-size:13px;font-weight:700}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 2px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .2s}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border-radius:14px;padding:14px;font-weight:700;text-align:center;background:var(--card2)}
.btn.pri{background:linear-gradient(135deg,var(--pur),var(--pur2))}.btn.dng{background:rgba(248,113,113,.15);color:var(--bad)}
.clrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.clr{height:46px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:13px;color:#fff}.clr.sel{border-color:#fff}.clr.gray{background:radial-gradient(50% 100%,rgb(71,67,84),rgb(37,37,52))}.clr.purple{background:radial-gradient(50% 100%,rgb(104,66,216),rgb(59,23,164))}.clr.red{background:radial-gradient(50% 100%,rgb(224,64,74),rgb(150,22,38))}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:2px}
.ic{aspect-ratio:1;border-radius:14px;background:var(--card2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;padding:6px}
.ic img{width:100%;height:100%;object-fit:contain}
.ic.sel{border-color:var(--pur);background:rgba(104,66,216,.25)}
.ic.up{font-size:26px;color:var(--mut);border:2px dashed rgba(255,255,255,.2);background:none}
.prev{display:flex;justify-content:center;margin:6px 0 2px}.prev .tile{width:110px}
.note{font-size:12px;color:var(--mut);line-height:1.45;margin:8px 2px}
textarea{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,40px);background:#fff;color:#000;border-radius:14px;padding:11px 16px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.denied{text-align:center;padding:80px 20px;color:var(--mut)}
.secrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.secrow button{background:rgba(248,113,113,.15);color:var(--bad);border-radius:12px;width:44px;height:44px;font-size:18px}
</style>
</head>
<body>
<div id="app"></div>

<!-- редактор кейса -->
<div class="layer" id="caseLayer"></div>
<!-- окна поверх -->
<div class="layer sheet" id="prizeSheet"><div class="sheet-box" id="prizeBox"></div></div>
<div class="layer sheet" id="jsonSheet"><div class="sheet-box" id="jsonBox"></div></div>
<div class="layer sheet" id="secSheet"><div class="sheet-box" id="secBox"></div></div>
<input type="file" id="fileIcon" accept="image/*" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
(function(){
  var S=window.ApexCases, tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){try{tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor('#0f0f17');tg.setBackgroundColor&&tg.setBackgroundColor('#0f0f17')}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')};
  var fmt=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
  var clone=function(o){return JSON.parse(JSON.stringify(o))};
  var round4=function(x){return Math.round(x*10000)/10000};
  var ui={caseId:null,prizeId:null};

  /* ---------- доступ ---------- */
  var ids=window.APEX_ADMIN_IDS||[], uid=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id;
  if(ids.length&&ids.indexOf(uid)<0){ $('app').innerHTML='<div class="denied"><h2>Нет доступа</h2><p>Эта панель только для администраторов.</p></div>'; return; }

  /* ---------- сохранение (сразу применяется везде) ---------- */
  var st=document.createElement('span');
  function setStatus(kind,text){var e=$('status'); if(!e)return; e.className='status '+(kind||''); e.lastChild.textContent=text}
  var toastT=0;
  function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on')},1800)}
  var saveT=0, queued=null, saving=false;
  function mutate(fn,now){
    var c=clone(cfg()); fn(c); queued=c; setStatus('busy','Сохраняю…');
    clearTimeout(saveT); saveT=setTimeout(flush,now?0:350);
  }
  function flush(){
    if(saving){saveT=setTimeout(flush,200);return}
    if(!queued)return; var c=queued; queued=null; saving=true;
    S.save(c).then(function(){setStatus('', 'Сохранено · обновилось у всех')}).catch(function(e){setStatus('err','Ошибка: '+(e&&e.message||e));toast('Не удалось сохранить: '+(e&&e.message||e))}).then(function(){saving=false});
  }
  /* актуальные данные с учётом ещё не отправленных правок */
  function cfg(){return queued||S.get()}
  function caseById(id,c){c=c||cfg();return c.cases.filter(function(x){return x.id===id})[0]}

  /* ---------- главный экран ---------- */
  function sumOf(c){return round4((c.prizes||[]).reduce(function(s,p){return s+Number(p.chance||0)},0))}
  function tagOf(c){
    if(!(c.prizes||[]).length) return '<span class="tag none">без призов</span>';
    var s=sumOf(c); return Math.abs(s-100)<0.0051?'<span class="tag ok">'+c.prizes.length+' призов · 100%</span>':'<span class="tag warn">'+c.prizes.length+' призов · '+s+'%</span>';
  }
  function renderMain(){
    var c=cfg(), html='';
    html+='<div class="top"><h1>Админ-панель</h1><div class="status" id="status"><i></i><span>Готово</span></div></div>';
    html+='<p class="mode">'+(window.APEX_API?'Сервер: '+esc(window.APEX_API):'Локальный режим (без сервера): правки видны на этом устройстве')+'</p>';
    html+='<div class="toolbar"><button class="chipbtn" data-a="addcase">＋ Кейс</button><button class="chipbtn" data-a="secs">Разделы</button><button class="chipbtn" data-a="json">Копия / импорт</button></div>';
    c.sections.forEach(function(sec){
      var list=c.cases.filter(function(x){return x.section===sec.id});
      html+='<div class="sec"><div class="sec-h"><h2>'+esc(S.title(sec,'ru'))+'<span>'+list.length+'</span></h2><button class="add" data-a="addcase" data-sec="'+esc(sec.id)+'">＋ Кейс</button></div>';
      if(!list.length) html+='<div class="empty">Пока пусто</div>';
      list.forEach(function(k){
        html+='<button class="row" data-a="edit" data-id="'+esc(k.id)+'"><div class="mini '+(k.theme==='dark'?'dark':'purple')+'">'+(k.image?'<img src="'+esc(k.image)+'" alt="">':'<img src="'+esc(S.iconSrc('star'))+'" alt="" style="opacity:.9">')+'</div><div><div class="nm">'+esc(S.name(k,'ru'))+'</div><div class="sub">'+esc(S.name(k,'en'))+' '+tagOf(k)+'</div></div><div class="pr">⭐ '+fmt(k.price)+'</div></button>';
      });
      html+='</div>';
    });
    $('app').innerHTML=html;
  }
  $('app').addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b)return; var a=b.getAttribute('data-a');
    if(a==='edit') openCase(b.getAttribute('data-id'));
    if(a==='addcase') addCase(b.getAttribute('data-sec'));
    if(a==='secs') openSecs();
    if(a==='json') openJson();
  });
  function addCase(sec){
    var id=S.newId('c');
    mutate(function(c){
      c.cases.push({id:id,section:sec||(c.sections[0]&&c.sections[0].id)||'',name:{ru:'Новый кейс',en:'New case'},price:100,image:'',theme:'purple',prizes:[]});
    },true);
    renderMain(); openCase(id);
  }

  /* ---------- редактор кейса ---------- */
  function colCur(p){return p.color||(p.amount>=200?'purple':'gray')}
  function colClass(p){var c=colCur(p);return c==='purple'?'purple':c==='red'?'red':'dark'}
  function tileHtml(p){
    var it=p.kind==='item';
    return '<div class="tile '+colClass(p)+'" data-a="prize" data-pid="'+esc(p.id)+'"><img src="'+esc(S.iconSrc(p.icon))+'" alt="">'+(it?'<small style="max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc((p.name&&(p.name.ru||p.name.en))||'Предмет')+'</small>':'')+'<b>'+fmt(p.amount)+'</b><small>'+round4(p.chance)+'%</small></div>';
  }
  function sumBlock(k){
    var s=sumOf(k), cls=Math.abs(s-100)<0.0051?'':(s>100?'bad':'warn');
    return '<div class="sum"><span>Сумма шансов: '+s+'%</span><button class="chipbtn" data-a="norm">Выровнять до 100%</button></div><div class="bar '+cls+'"><i style="width:'+Math.min(100,s)+'%"></i></div>'+(cls?'<p class="note">'+(s>100?'Сумма больше 100% — шансы будут пересчитаны пропорционально.':'Сумма меньше 100% — шансы будут пересчитаны пропорционально.')+' Лучше нажмите «Выровнять».</p>':'');
  }
  function openCase(id){
    ui.caseId=id; var k=caseById(id); if(!k)return;
    var c=cfg();
    var secOpts=c.sections.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===k.section?' selected':'')+'>'+esc(S.title(s,'ru'))+'</option>'}).join('');
    $('caseLayer').innerHTML=
      '<div class="hd"><button class="back" data-a="close">‹</button><h2>Кейс</h2><div class="status" id="status" style="margin-left:auto"><i></i><span>Готово</span></div></div>'+
      '<div class="g2"><div><label>Название (RU)</label><input id="fNameRu" value="'+esc(k.name.ru)+'"></div><div><label>Название (EN)</label><input id="fNameEn" value="'+esc(k.name.en)+'"></div></div>'+
      '<div class="g2"><div><label>Цена, ⭐</label><input id="fPrice" type="number" inputmode="numeric" min="1" value="'+esc(k.price)+'"></div><div><label>Раздел</label><select id="fSec">'+secOpts+'</select></div></div>'+
      '<div class="g2"><div><label>Стиль карточки</label><select id="fTheme"><option value="dark"'+(k.theme==='dark'?' selected':'')+'>Тёмный</option><option value="purple"'+(k.theme!=='dark'?' selected':'')+'>Фиолетовый</option></select></div><div><label>Картинка (ссылка)</label><input id="fImg" placeholder="https://…" value="'+esc(k.image||'')+'"></div></div>'+
      '<div class="toolbar" style="margin-top:10px"><button class="chipbtn" data-a="upImg">Загрузить картинку</button><button class="chipbtn" data-a="clrImg">Убрать картинку</button></div>'+
      '<label style="margin-top:18px">Призы внутри кейса</label><div class="tiles" id="tiles"></div><div id="sumBlock"></div>'+
      '<div class="actions"><button class="btn dng" data-a="delcase">Удалить кейс</button><button class="btn pri" data-a="close">Готово</button></div>';
    $('caseLayer').classList.add('on'); $('caseLayer').scrollTop=0; refreshTiles(); backBtn();
  }
  function refreshTiles(){
    var k=caseById(ui.caseId); if(!k)return;
    $('tiles').innerHTML=(k.prizes||[]).map(tileHtml).join('')+'<div class="tile plus" data-a="addprize">＋</div>';
    $('sumBlock').innerHTML=sumBlock(k);
  }
  function closeCase(){ui.caseId=null;$('caseLayer').classList.remove('on');renderMain();backBtn()}
  function bindCaseField(id,fn){var e=$(id); if(e)e.addEventListener('input',function(){mutate(function(c){var k=caseById(ui.caseId,c);if(k)fn(k,e.value,c)})})}
  $('caseLayer').addEventListener('input',function(e){
    var id=e.target.id, v=e.target.value, cid=ui.caseId; if(!cid)return;
    var m={fNameRu:function(k){k.name.ru=v},fNameEn:function(k){k.name.en=v},fPrice:function(k){var n=parseInt(v,10);if(n>0)k.price=n},fSec:function(k){k.section=v},fTheme:function(k){k.theme=v},fImg:function(k){k.image=v.trim()}}[id];
    if(m) mutate(function(c){var k=caseById(cid,c);if(k)m(k)});
  });
  $('caseLayer').addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b)return; var a=b.getAttribute('data-a');
    if(a==='close') closeCase();
    if(a==='addprize') openPrize('new');
    if(a==='prize') openPrize(b.getAttribute('data-pid'));
    if(a==='norm') normalize();
    if(a==='upImg') $('fileImg').click();
    if(a==='clrImg'){$('fImg').value='';mutate(function(c){caseById(ui.caseId,c).image=''})}
    if(a==='delcase') confirmDo('Удалить этот кейс вместе с призами?',function(){var id=ui.caseId;mutate(function(c){c.cases=c.cases.filter(function(x){return x.id!==id})},true);closeCase();toast('Кейс удалён')});
  });
  function normalize(){
    mutate(function(c){
      var k=caseById(ui.caseId,c), s=sumOf(k); if(!k.prizes.length||s<=0)return;
      var acc=0; k.prizes.forEach(function(p,i){ if(i===k.prizes.length-1){p.chance=round4(100-acc)} else {p.chance=round4(p.chance/s*100);acc+=p.chance} });
    },true); refreshTiles();
  }

  /* ---------- редактор приза ---------- */
  function openPrize(pid){
    var k=caseById(ui.caseId); if(!k)return;
    var p;
    if(pid==='new'){
      var rest=Math.max(0,round4(100-sumOf(k)));
      p={id:S.newId('p'),kind:'stars',amount:100,icon:'star',chance:rest||1,_new:true};
    } else { p=clone((k.prizes||[]).filter(function(x){return x.id===pid})[0]); if(p&&p.kind==='item'){p.name=p.name||{ru:'',en:''};p.sell=p.sell||p.amount} }
    if(!p)return;
    ui.prizeId=p.id; ui.draftPrize=p;
    renderPrize(); $('prizeSheet').classList.add('on'); backBtn();
  }
  function renderPrize(){
    var p=ui.draftPrize, it=p.kind==='item';
    var icons=S.icons().filter(function(i){return i.id==='star'||i.id===p.icon}).map(function(i){return '<button class="ic'+(i.id===p.icon?' sel':'')+'" data-a="pick" data-icon="'+esc(i.id)+'" title="'+esc(i.name)+'"><img src="'+esc(i.src)+'" alt=""></button>'}).join('')+'<button class="ic up" data-a="upIcon">＋</button>';
    $('prizeBox').innerHTML=
      '<div class="hd"><h2>'+(p._new?'Новый приз':'Приз')+'</h2></div>'+
      '<div class="prev" id="pPrev"></div>'+
      '<div class="g2" style="margin-top:8px"><button class="btn'+(it?'':' pri')+'" data-a="kind" data-k="stars">⭐ Звёзды</button><button class="btn'+(it?' pri':'')+'" data-a="kind" data-k="item">🎁 Предмет</button></div>'+
      '<label>'+(it?'Картинка предмета':'Иконка')+'</label><div class="icons">'+icons+'</div>'+
      '<label>Или по ссылке на картинку</label><div class="g2" style="grid-template-columns:1fr auto;align-items:center"><input id="pUrl" type="url" inputmode="url" placeholder="https://…/picture.png"><button class="chipbtn" data-a="addUrl">🔗 Добавить</button></div>'+
      '<label>Цвет карточки</label><div class="clrs">'+[['gray','Серый'],['purple','Фиолетовый'],['red','Красный']].map(function(c){return '<button class="clr '+c[0]+(colCur(p)===c[0]?' sel':'')+'" data-a="color" data-c="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div>'+
      (it?'<div class="g2"><div><label>Название (RU)</label><input id="pNameRu" value="'+esc(p.name.ru)+'"></div><div><label>Название (EN)</label><input id="pNameEn" value="'+esc(p.name.en)+'"></div></div>':'')+
      '<div class="g2"><div><label>'+(it?'Цена продажи, ⭐':'Сумма, ⭐')+'</label><input id="'+(it?'pSell':'pAmount')+'" type="number" inputmode="numeric" min="1" value="'+esc(it?p.sell:p.amount)+'"></div><div><label>Шанс, %</label><input id="pChance" type="number" inputmode="decimal" step="any" min="0" max="100" value="'+esc(p.chance)+'"></div></div>'+
      '<div class="toolbar" style="margin-top:10px"><button class="chipbtn" data-a="rest">Весь остаток до 100%</button></div>'+
      '<p class="note">Шанс — в процентах, можно дробный (например 0.01). Сумма шансов всех призов кейса должна быть 100%.'+(it?' Предмет можно продать за указанную цену — звёзды придут на баланс.':'')+'</p>'+
      '<div class="actions">'+(p._new?'<button class="btn" data-a="cancel">Отмена</button>':'<button class="btn dng" data-a="delprize">Удалить</button>')+'<button class="btn pri" data-a="saveprize">Готово</button></div>';
    updPrev();
  }
  function updPrev(){
    var p=ui.draftPrize,it=p.kind==='item';
    $('pPrev').innerHTML='<div class="tile '+colClass(p)+'"><img src="'+esc(S.iconSrc(p.icon))+'" alt="">'+(it?'<small style="max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name.ru||p.name.en||'Предмет')+'</small>':'')+'<b>'+fmt(p.amount||0)+'</b><small>'+round4(p.chance||0)+'%</small></div>';
  }
  $('prizeBox').addEventListener('input',function(e){
    var p=ui.draftPrize,id=e.target.id,v=e.target.value;
    if(id==='pAmount'){p.amount=parseInt(v,10)||0}
    if(id==='pSell'){p.sell=parseInt(v,10)||0;p.amount=p.sell}
    if(id==='pNameRu'){p.name.ru=v}
    if(id==='pNameEn'){p.name.en=v}
    if(id==='pChance'){p.chance=parseFloat(String(v).replace(',','.'))||0}
    updPrev();
  });
  $('prizeBox').addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b)return; var a=b.getAttribute('data-a'), p=ui.draftPrize;
    if(a==='kind'){
      var k2=b.getAttribute('data-k');
      if(k2==='item'&&p.kind!=='item'){p.kind='item';p.name=p.name||{ru:'',en:''};p.sell=p.sell||p.amount||100;p.amount=p.sell}
      if(k2==='stars'&&p.kind==='item'){p.kind='stars';p.amount=p.sell||p.amount||100}
      renderPrize();
    }
    if(a==='pick'){p.icon=b.getAttribute('data-icon');renderPrize()}
    if(a==='upIcon') $('fileIcon').click();
    if(a==='color'){p.color=b.getAttribute('data-c');renderPrize()}
    if(a==='addUrl'){
      var u=($('pUrl').value||'').trim();
      if(!/^(https?:\/\/|data:image\/)/i.test(u)){toast('Вставьте ссылку на картинку (https://…)');return}
      addIconFromUrl(u);
    }
    if(a==='rest'){var k=caseById(ui.caseId);var others=(k.prizes||[]).filter(function(x){return x.id!==p.id}).reduce(function(s,x){return s+x.chance},0);p.chance=Math.max(0,round4(100-others));renderPrize()}
    if(a==='cancel') closePrize();
    if(a==='delprize') confirmDo('Удалить этот приз?',function(){var id=p.id;mutate(function(c){var k=caseById(ui.caseId,c);k.prizes=k.prizes.filter(function(x){return x.id!==id})},true);closePrize();refreshTiles()});
    if(a==='saveprize'){
      var it=p.kind==='item';
      if(it){
        if(!(p.sell>0)){toast('Укажите цену продажи больше 0');return}
        var nr=(p.name.ru||'').trim(), ne=(p.name.en||'').trim();
        if(!nr&&!ne){toast('Укажите название предмета');return}
        p.name={ru:nr||ne,en:ne||nr}; p.amount=p.sell;
      } else if(!(p.amount>0)){toast('Укажите сумму больше 0');return}
      if(!(p.chance>=0)){toast('Шанс не может быть отрицательным');return}
      var np={id:p.id,amount:p.amount,icon:p.icon,chance:round4(p.chance)};
      if(it){np.kind='item';np.name=p.name;np.sell=p.sell}
      if(p.color)np.color=p.color;
      mutate(function(c){var k=caseById(ui.caseId,c);if(!k.prizes)k.prizes=[];var i=k.prizes.map(function(x){return x.id}).indexOf(np.id);if(i<0)k.prizes.push(np);else k.prizes[i]=np},true);
      closePrize(); refreshTiles();
    }
  });
  function closePrize(){ui.prizeId=null;$('prizeSheet').classList.remove('on');backBtn()}
  $('prizeSheet').addEventListener('click',function(e){if(e.target===this){if(ui.draftPrize&&ui.draftPrize._new)closePrize();else closePrize()}});

  /* ---------- загрузка картинок ---------- */
  function resize(file,size,cb){
    var r=new FileReader(); r.onload=function(){var im=new Image(); im.onload=function(){
      var s=Math.min(1,size/Math.max(im.width,im.height)), w=Math.round(im.width*s), h=Math.round(im.height*s);
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); cb(cv.toDataURL('image/png'));
    }; im.onerror=function(){toast('Не удалось прочитать картинку')}; im.src=r.result}; r.readAsDataURL(file);
  }
  function pushIcon(src,name){
    var id=S.newId('u'); mutate(function(c){c.icons=c.icons||[];c.icons.push({id:id,name:name,src:src})},true);
    if(ui.draftPrize){ui.draftPrize.icon=id;} setTimeout(renderPrize,60);
  }
  /* по ссылке: пробуем сохранить копию картинки (не зависит от чужого сайта); если сайт не разрешает — сохраняем саму ссылку */
  function addIconFromUrl(u){
    if(u.indexOf('data:')===0){pushIcon(u,'Своя');return}
    var im=new Image(); im.crossOrigin='anonymous';
    im.onload=function(){
      try{
        var sc=Math.min(1,256/Math.max(im.naturalWidth,im.naturalHeight)), w=Math.round(im.naturalWidth*sc), h=Math.round(im.naturalHeight*sc);
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h);
        pushIcon(cv.toDataURL('image/png'),'Ссылка');
      }catch(e){pushIcon(u,'Ссылка')}
    };
    im.onerror=function(){
      var im2=new Image();
      im2.onload=function(){pushIcon(u,'Ссылка')};
      im2.onerror=function(){toast('Не удалось загрузить картинку по ссылке')};
      im2.src=u;
    };
    im.src=u;
  }
  $('fileIcon').addEventListener('change',function(){
    var f=this.files[0]; this.value=''; if(!f)return;
    resize(f,256,function(src){
      var id=S.newId('u'); mutate(function(c){c.icons=c.icons||[];c.icons.push({id:id,name:'Своя',src:src})},true);
      if(ui.draftPrize){ui.draftPrize.icon=id;} setTimeout(renderPrize,60);
    });
  });
  $('fileImg').addEventListener('change',function(){
    var f=this.files[0]; this.value=''; if(!f)return;
    resize(f,256,function(src){mutate(function(c){caseById(ui.caseId,c).image=src},true);var e=$('fImg');if(e)e.value='(загруженная картинка)'});
  });

  /* ---------- разделы ---------- */
  function openSecs(){renderSecs();$('secSheet').classList.add('on');backBtn()}
  function renderSecs(){
    var c=cfg();
    $('secBox').innerHTML='<div class="hd"><h2>Разделы</h2></div><p class="note">Название раздела на русском и английском. Раздел с кейсами удалить нельзя.</p>'+
      c.sections.map(function(s){return '<div class="secrow"><input data-sid="'+esc(s.id)+'" data-l="ru" value="'+esc(s.title.ru)+'" placeholder="RU"><input data-sid="'+esc(s.id)+'" data-l="en" value="'+esc(s.title.en)+'" placeholder="EN"><button data-a="delsec" data-sid="'+esc(s.id)+'">✕</button></div>'}).join('')+
      '<div class="actions"><button class="btn" data-a="addsec">＋ Раздел</button><button class="btn pri" data-a="closesec">Готово</button></div>';
  }
  $('secBox').addEventListener('input',function(e){
    var sid=e.target.getAttribute('data-sid'),l=e.target.getAttribute('data-l'); if(!sid)return;
    mutate(function(c){var s=c.sections.filter(function(x){return x.id===sid})[0];if(s)s.title[l]=e.target.value})
  });
  $('secBox').addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b)return; var a=b.getAttribute('data-a');
    if(a==='closesec'){$('secSheet').classList.remove('on');renderMain();backBtn()}
    if(a==='addsec'){mutate(function(c){c.sections.push({id:S.newId('s'),title:{ru:'Новый раздел',en:'New section'}})},true);setTimeout(renderSecs,30)}
    if(a==='delsec'){var sid=b.getAttribute('data-sid');
      if(cfg().cases.some(function(k){return k.section===sid})){toast('В разделе есть кейсы — сначала удалите или перенесите их');return}
      mutate(function(c){c.sections=c.sections.filter(function(s){return s.id!==sid})},true);setTimeout(renderSecs,30)}
  });

  /* ---------- копия / импорт ---------- */
  function openJson(){
    $('jsonBox').innerHTML='<div class="hd"><h2>Копия / импорт</h2></div><p class="note">Вся конфигурация кейсов одним текстом. Скопируйте как резервную копию или вставьте чужую и нажмите «Импорт».</p><textarea id="jsonTa" spellcheck="false">'+esc(JSON.stringify(S.get(),null,1).replace(/"data:image[^"]{200,}"/g,function(m){return m}))+'</textarea>'+
      '<div class="actions"><button class="btn" data-a="copy">Скопировать</button><button class="btn pri" data-a="import">Импорт</button></div><div class="actions"><button class="btn dng" data-a="reset">Сбросить к исходным</button><button class="btn" data-a="closejson">Закрыть</button></div>';
    $('jsonSheet').classList.add('on'); backBtn();
  }
  $('jsonBox').addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b)return; var a=b.getAttribute('data-a'), ta=$('jsonTa');
    if(a==='closejson'){$('jsonSheet').classList.remove('on');backBtn()}
    if(a==='copy'){ta.select();try{document.execCommand('copy');toast('Скопировано')}catch(err){toast('Выделите текст и скопируйте вручную')}}
    if(a==='import'){try{var j=JSON.parse(ta.value);if(!j||!Array.isArray(j.cases)||!Array.isArray(j.sections))throw new Error('нет cases/sections');
      confirmDo('Заменить все кейсы данными из текста?',function(){queued=null;S.save(j).then(function(){toast('Импортировано');renderMain();$('jsonSheet').classList.remove('on')}).catch(function(er){toast('Ошибка: '+er.message)})})}catch(err){toast('Неверный JSON: '+err.message)}}
    if(a==='reset') confirmDo('Сбросить все кейсы к исходным? Ваши правки пропадут.',function(){queued=null;S.reset().then(function(){toast('Сброшено');renderMain();$('jsonSheet').classList.remove('on')})});
  });

  /* ---------- общее ---------- */
  function confirmDo(text,fn){ if(tg&&tg.showConfirm) tg.showConfirm(text,function(ok){if(ok)fn()}); else if(confirm(text)) fn(); }
  function topLayer(){
    if($('jsonSheet').classList.contains('on'))return 'json';
    if($('secSheet').classList.contains('on'))return 'sec';
    if($('prizeSheet').classList.contains('on'))return 'prize';
    if($('caseLayer').classList.contains('on'))return 'case';
    return null;
  }
  function goBack(){var t=topLayer();
    if(t==='json')$('jsonSheet').classList.remove('on'); else if(t==='sec'){$('secSheet').classList.remove('on');renderMain()} else if(t==='prize')closePrize(); else if(t==='case')closeCase();
    backBtn();
  }
  function backBtn(){ if(!(tg&&tg.BackButton))return; if(topLayer()){tg.BackButton.show()}else{tg.BackButton.hide()} }
  if(tg&&tg.BackButton) tg.BackButton.onClick(goBack);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')goBack()});

  /* изменения с другого устройства/вкладки подтягиваются сами */
  S.onChange(function(){
    if(queued||saving)return;
    if(!ui.caseId) renderMain(); else { var k=caseById(ui.caseId); if(!k){closeCase()} else refreshTiles(); }
  });
  S.load().then(renderMain);
  renderMain();
})();
</script>
</body>
</html>
