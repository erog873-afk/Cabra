<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Админка кейсов</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11131a;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px}
h1{font-size:24px;margin:0 0 6px}
.sub{color:#9297a5;font-size:13px;margin-bottom:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
button{border:0;border-radius:12px;padding:12px 16px;background:#2b2f3b;color:#fff;font-weight:700;cursor:pointer}
button.primary{background:#fff;color:#111}
button.danger{background:#57252b}
.status{padding:12px;border-radius:12px;background:#1b1e27;margin-bottom:15px;color:#cdd1dc}
.card{background:#1a1d26;border:1px solid #292d38;border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 140px;gap:12px}
label{display:block;color:#9297a5;font-size:12px;margin:0 0 6px}
input,select{width:100%;border:1px solid #303541;background:#11141b;color:#fff;border-radius:10px;padding:11px;font-size:15px;outline:none}
input:focus,select:focus{border-color:#777f91}
.field{margin-bottom:12px}
.preview{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.preview img{width:58px;height:58px;object-fit:contain;border-radius:12px;background:#11141b}
.preview .noimg{width:58px;height:58px;border-radius:12px;background:#242833;display:flex;align-items:center;justify-content:center;color:#777;font-size:11px}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.cardtitle{font-size:17px;font-weight:700}
.small{font-size:12px;color:#7f8594}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;color:#858b99;padding:35px}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Админ-панель кейсов</h1>
  <div class="sub">Редактирование названий, цен, изображений и оформления. Другие страницы проекта не изменяются.</div>

  <div class="toolbar">
    <button id="reload">Обновить</button>
    <button id="add" class="primary">+ Добавить кейс</button>
    <button id="save" class="primary">Сохранить изменения</button>
  </div>

  <div id="status" class="status">Загрузка...</div>
  <div id="list"></div>
</div>

<script>
(function(){
  'use strict';

  var config = null;
  var list = document.getElementById('list');
  var status = document.getElementById('status');

  function tgInit(){
    try{
      return (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || '';
    }catch(e){ return ''; }
  }

  function setStatus(text, ok){
    status.textContent = text;
    status.style.color = ok === true ? '#8fe3a0' : ok === false ? '#ff9a9a' : '#cdd1dc';
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function num(v){
    var n = Number(String(v).replace(',', '.'));
    return Number.isFinite(n) ? n : 0;
  }

  function render(){
    list.innerHTML = '';
    var cases = (config && Array.isArray(config.cases)) ? config.cases : [];

    if(!cases.length){
      list.innerHTML = '<div class="empty">Кейсов пока нет</div>';
      return;
    }

    cases.forEach(function(c, i){
      var el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<div class="cardtop">' +
          '<div><div class="cardtitle">Кейс #' + (i+1) + '</div>' +
          '<div class="small">ID: ' + esc(c.id || '') + '</div></div>' +
          '<button class="danger" data-remove="'+i+'">Удалить</button>' +
        '</div>' +

        '<div class="preview">' +
          (c.image ? '<img src="'+esc(c.image)+'" onerror="this.style.display=\'none\'">' :
                     '<div class="noimg">нет фото</div>') +
          '<div><b>' + esc(c.nameRu || c.name || 'Без названия') + '</b><div class="small">Предпросмотр</div></div>' +
        '</div>' +

        '<div class="row">' +
          '<div class="field"><label>Название (русский)</label><input data-i="'+i+'" data-k="nameRu" value="'+esc(c.nameRu || c.name || '')+'"></div>' +
          '<div class="field"><label>Цена</label><input type="number" min="0" step="1" data-i="'+i+'" data-k="price" value="'+esc(c.price == null ? 0 : c.price)+'"></div>' +
        '</div>' +

        '<div class="row">' +
          '<div class="field"><label>Название (английский)</label><input data-i="'+i+'" data-k="nameEn" value="'+esc(c.nameEn || '')+'"></div>' +
          '<div class="field"><label>Тема</label><select data-i="'+i+'" data-k="theme">' +
            '<option value="dark" '+((c.theme||'dark')==='dark'?'selected':'')+'>dark</option>' +
            '<option value="purple" '+((c.theme||'dark')==='purple'?'selected':'')+'>purple</option>' +
          '</select></div>' +
        '</div>' +

        '<div class="field"><label>Изображение (URL)</label><input data-i="'+i+'" data-k="image" value="'+esc(c.image || '')+'"></div>' +
        '<div class="field"><label>ID кейса</label><input data-i="'+i+'" data-k="id" value="'+esc(c.id || '')+'"></div>' +
        '<div class="field"><label>Раздел</label><input data-i="'+i+'" data-k="section" value="'+esc(c.section || 'stars')+'"></div>';

      list.appendChild(el);
    });
  }

  function collect(){
    list.querySelectorAll('[data-i][data-k]').forEach(function(input){
      var i = Number(input.getAttribute('data-i'));
      var k = input.getAttribute('data-k');
      if(!config.cases[i]) return;
      if(k === 'price') config.cases[i][k] = num(input.value);
      else config.cases[i][k] = input.value;
    });

    config.cases.forEach(function(c){
      c.name = c.nameRu || c.name || '';
      if(!c.nameRu) c.nameRu = c.name || '';
      if(!c.nameEn) c.nameEn = c.name || '';
      if(!c.section) c.section = 'stars';
      if(!c.theme) c.theme = 'dark';
      if(c.price == null) c.price = 0;
      if(!c.image) c.image = '';
    });
  }

  async function load(){
    setStatus('Загрузка...', null);
    try{
      var r = await fetch('/api/cases?ts='+Date.now(), {
        cache:'no-store',
        headers:{'Accept':'application/json'}
      });
      var data = await r.json();
      if(!r.ok) throw new Error(data.error || ('HTTP '+r.status));
      config = data;
      if(!Array.isArray(config.cases)) config.cases = [];
      if(!Array.isArray(config.sections)) config.sections = [];
      render();
      setStatus('Данные загружены. Версия: '+(config.version || 0), true);
    }catch(e){
      setStatus('Ошибка загрузки: '+e.message, false);
      list.innerHTML = '<div class="empty">Не удалось получить /api/cases</div>';
    }
  }

  async function save(){
    if(!config) return;
    collect();
    setStatus('Сохранение...', null);

    try{
      var initData = tgInit();

      if(!initData){
        setStatus('Открой админку внутри Telegram, чтобы сервер мог проверить администратора.', false);
        return;
      }

      var r = await fetch('/api/cases', {
        method:'PUT',
        headers:{
          'Content-Type':'application/json',
          'X-Init-Data':initData
        },
        body:JSON.stringify(config)
      });

      var data = await r.json();

      if(!r.ok){
        throw new Error(data.error || ('HTTP '+r.status));
      }

      config = data.config || config;
      render();
      setStatus('Сохранено. Версия: '+(config.version || 0), true);
    }catch(e){
      setStatus('Ошибка сохранения: '+e.message, false);
    }
  }

  function addCase(){
    if(!config) return;
    collect();

    var id = 'case-' + Date.now();
    config.cases.push({
      id:id,
      section:'stars',
      name:'Новый кейс',
      nameRu:'Новый кейс',
      nameEn:'New case',
      price:50,
      theme:'dark',
      image:''
    });

    render();
    setStatus('Новый кейс добавлен. Нажми «Сохранить изменения».', null);
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  }

  list.addEventListener('click', function(e){
    var btn = e.target.closest('[data-remove]');
    if(!btn) return;

    var i = Number(btn.getAttribute('data-remove'));
    if(!confirm('Удалить этот кейс?')) return;

    collect();
    var removed = config.cases.splice(i,1)[0];
    render();
    setStatus('Кейс удалён. Сохраняю изменения...', null);

    // Удаление сохраняется сразу, чтобы после обновления страницы кейс не вернулся.
    try{
      var initData = tgInit();
      if(!initData){
        // Возвращаем кейс, если админка открыта не внутри Telegram.
        config.cases.splice(i,0,removed);
        render();
        setStatus('Открой админку внутри Telegram — серверу нужен Telegram initData.', false);
        return;
      }

      fetch('/api/cases', {
        method:'PUT',
        headers:{
          'Content-Type':'application/json',
          'X-Init-Data':initData
        },
        body:JSON.stringify(config)
      })
      .then(function(r){
        return r.json().then(function(data){
          if(!r.ok) throw new Error(data.error || ('HTTP '+r.status));
          return data;
        });
      })
      .then(function(data){
        config = data.config || config;
        render();
        setStatus('Кейс удалён и сохранён. Версия: '+(config.version || 0), true);
      })
      .catch(function(err){
        config.cases.splice(i,0,removed);
        render();
        setStatus('Удаление не сохранено: '+err.message, false);
      });
    }catch(err){
      config.cases.splice(i,0,removed);
      render();
      setStatus('Удаление не сохранено: '+err.message, false);
    }
  });

  document.getElementById('reload').addEventListener('click', load);
  document.getElementById('save').addEventListener('click', save);
  document.getElementById('add').addEventListener('click', addCase);

  load();
})();
</script>
</body>
</html>
