function tone(f,t,d,type,v,f2){

function tick(speed){ // щелчок стрелки: чем быстрее вращение, тем выше тон
  var k=Math.min(1,speed/45); tone(520+k*700,0,0.045,'triangle',0.07+0.05*(1-k),260+k*300);
}
function whoosh(d){
  var c=audio(); if(!c) return; var n=c.sampleRate*d, buf=c.createBuffer(1,n,c.sampleRate), a=buf.getChannelData(0);
  for(var i=0;i<n;i++) a[i]=Math.random()*2-1;
  var src=c.createBufferSource(); src.buffer=buf;
  var bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
  bp.frequency.setValueAtTime(250,c.currentTime); bp.frequency.exponentialRampToValueAtTime(2200,c.currentTime+d*0.25); bp.frequency.exponentialRampToValueAtTime(300,c.currentTime+d);

  src.connect(bp); bp.connect(g); g.connect(c.destination); src.start();
}

  var tr=$('arrowTrack'), last=null, acc=0, t0=performance.now();
  function ang(){ var m=getComputedStyle(tr).transform, v=m&&m.match(/matrix\(([^)]+)\)/); if(!v) return 0; var p=v[1].split(',').map(parseFloat); return Math.atan2(p[1],p[0])*180/Math.PI }

    var a=ang();
    if(last!==null){ var d=a-last; if(d<-180) d+=360; if(d>180) d-=360; d=Math.abs(d); acc+=d;

}

st.innerHTML='<div class="st-tablist" role="tablist">'
 +'<button type="button" class="st-tab standalone-active" role="tab" aria-selected="true" data-standalone-tab="stars"><div class="IconText--content"><img alt="" src="'+STARPNG+'"><p>Звезды</p></div></button>'
 +'<button type="button" class="st-tab" role="tab" aria-selected="false" data-standalone-tab="gifts"><div class="IconText--content"><img alt="" src="https://storage.portal-market.com/portals-market/gifts/kissedfrog/models/png/bananapox.png" onerror="this.style.display=\'none\'"><p>Подарки</p></div></button>'

var panelEl=document.querySelector('[role="tabpanel"]');
panelEl.insertBefore(st,panelEl.firstChild);
var stakeInp=$('stakeInp'), stTabs=[].slice.call(st.querySelectorAll('[data-standalone-tab]'));
function showStars(){ return mode==='inv'&&kind==='stars' }
function applyView(){
  var srcTl=panelEl.querySelector('[aria-label="Источник подарков"]'), secTl=document.querySelector('[aria-label="Раздел"]');
  if(secTl) secTl.style.display='';
  [].forEach.call(panelEl.children,function(c){
    if(c===st) c.style.display=mode==='inv'?'':'none';
    else if(c===srcTl) c.style.display='none';
    else c.style.display=showStars()?'none':'';
  });
  $('stStars').hidden=!showStars();
  stTabs.forEach(function(b){ var on=b.getAttribute('data-standalone-tab')===kind; b.classList.toggle('standalone-active',on); b.setAttribute('aria-selected',String(on)); });
  if(showStars()) fitStake();
  cartUI();
}
function fitStake(){ var m=$('spMirror'); m.textContent=stakeInp.value||'0'; stakeInp.style.width=(m.offsetWidth+4)+'px'; }
function stakeUI(){
  var go=$('spGo'), cnt=(selected&&selected.isStars)?selected.stars:0;
  if(!cnt){ go.disabled=true; go.textContent='Введите сумму'; }
  else if(balance!==null&&cnt>balance){ go.disabled=false; go.textContent='Пополнить баланс'; go.setAttribute('data-act','topup'); }
  else { go.disabled=false; go.textContent='Поставить'; go.setAttribute('data-act','ok'); }
}
function setStake(n){
  n=Math.floor(n)||0;
  if(n<STAKE_MIN){ if(selected&&selected.isStars) selected=null; }
  else { n=Math.min(n,STAKE_MAX); selected={id:'stars',isStars:true,name:'Звёзды',num:'',price:n/STAR_PER_TON,stars:n,img:STAR}; }
  refresh();
}
function putStake(n){ stakeInp.value=n?fmt(n).replace(/\u00a0/g,' '):''; fitStake(); setStake(n); }
stakeInp.addEventListener('input',function(){
  if(busy) return;
  var d=stakeInp.value.replace(/\D/g,'').slice(0,8);
  if(d&&+d>STAKE_MAX) d=String(STAKE_MAX);
  stakeInp.value=d?fmt(+d).replace(/\u00a0/g,' '):''; fitStake();
  setStake(+d);
});
st.addEventListener('click',function(e){
  if(busy) return;
  var c=e.target.closest('.st-chip');
  if(c){ putStake(Math.min(STAKE_MAX,(selected&&selected.isStars?selected.stars:0)+(+c.getAttribute('data-add')))); return; }
  var g=e.target.closest('#spGo');
  if(g&&!g.disabled){
    if(g.getAttribute('data-act')==='topup'){ post({type:'upg-topup'}); return; }
    stakeInp.blur(); try{ $('boostBtn').scrollIntoView({behavior:'smooth',block:'center'}); }catch(x){}
    return;
  }
  var t=e.target.closest('[data-standalone-tab]');
  if(t){
    var k=t.getAttribute('data-standalone-tab'); if(k===kind) return;
    kind=k; page=1;
    tab=(k==='shop')?'shop':'mine';
    if(k==='gifts'&&selected&&selected.isStars) selected=null;      // ставка: что-то одно — звёзды или подарок
    if(k==='stars'&&selected&&!selected.isStars) selected=null;
    refresh();
  }
});
function syncStake(){ if(!(selected&&selected.isStars)){ var d=stakeInp.value.replace(/\D/g,''); if(!(document.activeElement===stakeInp&&d&&+d<STAKE_MIN)){ stakeInp.value=''; } } stakeUI(); }
/* связь с балансом родительской страницы */
function setBal(v){ balance=v; stakeUI(); renderWheel(); }
function spendStars(n){ if(balance!==null) balance-=n; post({type:'upg-spend',amount:n}); stakeUI(); }
function creditStars(n){ if(balance!==null) balance+=n; post({type:'upg-credit',amount:n}); stakeUI(); }
window.addEventListener('message',function(e){ var d=e.data; if(d&&d.type==='upg-balance'&&typeof d.value==='number'){ standalone=false; setBal(d.value); } });
setTimeout(function(){ if(balance===null){ standalone=true; setBal(100000); } },900);
